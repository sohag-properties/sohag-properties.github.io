<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>موقع القطعة - نسخة تجريبية</title>
<style>
body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0f2540;color:#0f172a}
.w{max-width:520px;margin:0 auto;padding:16px}
h1{color:#e6b84c;font-size:18px;margin:8px 0 4px}
.sub{color:#cbd5e1;font-size:12px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:800;margin:8px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;font-weight:700}
button.go{width:100%;margin-top:10px;background:#e6b84c;border:0;border-radius:12px;padding:12px;font-weight:900;font-size:15px;color:#0f2540}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #e2e8f0;padding:10px 0;font-size:13px;font-weight:700}
.r:first-child{border-top:0}
.r a{background:#15803d;color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:900;white-space:nowrap}
.n{font-size:11px;color:#475569;font-weight:600}
.warn{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;font-size:11.5px;font-weight:700;border-radius:12px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="w">
<h1>موقع القطعة على خرائط جوجل (نسخة تجريبية)</h1>
<div class="sub">اكتب رقم القطعة لتظهر لك كل القطع بهذا الرقم في المدينة، واختر الأقرب لمنطقتك.</div>
<div class="card">
<label for="n">رقم القطعة</label>
<input id="n" type="number" inputmode="numeric" placeholder="مثال: 151">
<label for="lm">رتّب حسب الأقرب إلى</label>
<select id="lm"></select>
<button class="go" onclick="go()">ابحث</button>
<div class="warn">الموقع تقريبي. الخطأ المتوقع نحو ٢٠ متر قرب وسط المدينة وقد يزيد في الأطراف. لا يُغني عن المعاينة على الطبيعة.</div>
</div>
<div id="out"></div>
</div>
<script>
var D=null;
function d2(a,b){var x=(a[0]-b[0])*110950,y=(a[1]-b[1])*99400;return Math.sqrt(x*x+y*y);}
fetch('data.json').then(function(r){return r.json();}).then(function(j){
  D=j; var s=document.getElementById('lm'); s.innerHTML='<option value="">بدون ترتيب</option>';
  Object.keys(j.lm).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});
  var q=new URLSearchParams(location.search).get('n'); if(q){document.getElementById('n').value=q;go();}
});
function go(){
  if(!D) return;
  var n=String(parseInt(document.getElementById('n').value,10));
  var out=document.getElementById('out'); var list=(D.p[n]||[]).slice();
  var lm=document.getElementById('lm').value, ref=lm?D.lm[lm]:null;
  if(!list.length){out.innerHTML='<div class="card n">لا توجد قطعة بهذا الرقم في الخريطة.</div>';return;}
  list=list.map(function(p){return {p:p,d:ref?d2(p,ref):0};});
  if(ref) list.sort(function(a,b){return a.d-b.d;}); else list.sort(function(a,b){return a.p[2]-b.p[2];});
  var h='<div class="card"><div class="n">'+list.length+' نتيجة للرقم '+n+(ref?' (الأقرب إلى '+lm+' أولاً)':'')+'</div>';
  list.slice(0,40).forEach(function(x,i){
    var p=x.p; var url='https://www.google.com/maps?q='+p[0]+','+p[1];
    h+='<div class="r"><div>'+D.h[p[2]]+(ref?'<div class="n">يبعد '+(x.d>=1000?(x.d/1000).toFixed(1)+' كم':Math.round(x.d)+' م')+' عن '+lm+'</div>':'')+'</div><a href="'+url+'" target="_blank" rel="noopener">افتح في الخريطة</a></div>';
  });
  if(list.length>40) h+='<div class="n">يُعرض أقرب ٤٠ نتيجة فقط. اختر مكاناً للترتيب.</div>';
  out.innerHTML=h+'</div>';
}
document.getElementById('n').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
</script>
</body>
</html>
